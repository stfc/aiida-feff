# RabbitMQ settings for the aiida-feff devcontainer.
#
# aiida-core reports any RabbitMQ >= 3.8.15 as unsupported, because from that
# version the server acknowledges a consumer timeout of 30 minutes by default
# and then closes the channel. A workchain step that takes longer than that
# (a real FEFF ensemble easily does) is killed mid-flight, and AiiDA may
# resubmit the job, which is the "long-running workflows crash, jobs submitted
# multiple times" the warning refers to.
#
# The alternative is pinning RabbitMQ to 3.8.14, the last version AiiDA
# accepts unconditionally, which means running a broker that stopped receiving
# security fixes years ago. Raising the timeout is what aiida-core's own
# documentation recommends instead:
# https://github.com/aiidateam/aiida-core/wiki/RabbitMQ-version-to-use
#
# 10000000000 ms is about 115 days, i.e. effectively no timeout.
consumer_timeout = 10000000000
