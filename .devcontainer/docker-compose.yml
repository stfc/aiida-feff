# Development environment for aiida-feff.
#
# Storage is core.sqlite_dos, matching the test suite (which uses
# aiida.tools.pytest_fixtures, itself sqlite-backed). PostgreSQL is therefore
# not needed by anything in this repository and is no longer started: it cost
# a service, a volume, eight environment variables and a schema-reset step
# that could destroy a developer's data on rebuild.
#
# RabbitMQ *is* kept, because examples/example_ensemble.py calls
# aiida.engine.submit, which needs a broker and a running daemon.
#
# Images are digest-pinned so a rebuild reproduces the same environment.
# Dependabot's "docker" ecosystem updates the digests; do not replace them
# with floating tags.
services:

  app:
    # mcr.microsoft.com/devcontainers/python:3.12
    image: mcr.microsoft.com/devcontainers/python@sha256:a00123df1ec4af04b4013fda8c27438b73b1817a24f6bcd3d61e2f6aa0800302
    volumes:
      - ..:/workspace:cached
      # Only AiiDA state is persisted. The virtualenv is NOT a volume: see
      # UV_PROJECT_ENVIRONMENT below.
      #
      # Both of these mount at paths that do not exist in the image, so the
      # runtime creates them owned by root rather than by vscode. post-create.sh
      # chowns them before first use; do not add a volume here without adding
      # it there too, or the first write fails with EACCES.
      - aiida-config:/home/vscode/.aiida
      - aiida-repository:/home/vscode/.aiida/repository
    environment:
      AIIDA_BROKER_HOST: rabbitmq
      AIIDA_BROKER_PORT: "5672"
      AIIDA_BROKER_USER: guest
      AIIDA_BROKER_PASS: guest
      # Keep the virtualenv out of the bind-mounted workspace. Sharing .venv
      # with the host makes the container inherit an interpreter built for the
      # host's OS and Python version (this repo is developed on macOS, the
      # image is Linux), and makes opening the container mutate the host's
      # working environment.
      #
      # A named volume at /workspace/.venv would also work, but the runtime
      # creates it root-owned and uv then fails on CACHEDIR.TAG with EACCES.
      # /home/vscode already exists in the image owned by vscode, so a plain
      # directory there needs no ownership fixing. It is rebuilt by uv sync on
      # each container create, which is cheap.
      UV_PROJECT_ENVIRONMENT: /home/vscode/.venv
      # Bind mounts do not support hardlinks.
      UV_LINK_MODE: copy
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: sleep infinity

  rabbitmq:
    # rabbitmq:3.13-alpine
    image: rabbitmq@sha256:d7af1c87c5f1eda13fcfca06db452bf3aeab6619fc3358b68535c0c02c4e52bc
    environment:
      RABBITMQ_ERLANG_COOKIE: "devcontainer-cookie"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  aiida-config:
  aiida-repository:
