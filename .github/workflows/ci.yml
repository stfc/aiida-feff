name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Runs exactly what `pre-commit run --all-files` runs locally, so code that
  # passes CI cannot be rejected by the hooks (and vice versa).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      # --locked: a bare `uv sync` re-resolves and silently rewrites uv.lock,
      # so the lockfile is advisory rather than binding and dependency drift
      # never fails a build. With the cap on md-exafs this is what makes a
      # physics-affecting bump a deliberate, reviewable change.
      - run: uv sync --locked --all-extras
      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 included because pyproject.toml claims to support it. Testing
        # only 3.10 and 3.12 made that classifier an unverified assertion.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra testing --extra plots
      - run: uv run pytest --cov=src/aiida_feff --cov-report=lcov
      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.12'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run coveralls

  # Builds the devcontainer and runs the suite inside it. Without this nothing
  # exercises .devcontainer/ at all: it sat unchanged from the second commit of
  # the project while the package moved underneath it, and every problem found
  # in review (a destructive reset, a Podman-only compose key, a shared host
  # venv, missing extras) would have been caught here.
  devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          # Both halves matter. The suite proves the environment works; the
          # smoke script proves examples/ still matches the API, which nothing
          # else checks -- three broken examples reached main before this
          # existed.
          runCmd: |
            uv run pytest tests -q
            bash .devcontainer/smoke-examples.sh
