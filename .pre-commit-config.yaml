repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # mypy runs through uv, in the project environment. The mirrors-mypy hook
      # installs mypy into an isolated venv without aiida, numpy or pymatgen,
      # so every annotation from those packages degrades to Any and the check
      # passes vacuously.
      # --no-sync: type-checking should not re-resolve the dependency tree on
      # every commit. CI runs `uv sync --all-extras` before pre-commit, and
      # locally the environment is the developer's to manage.
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy src
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
